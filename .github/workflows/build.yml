name: Build APK
"on":
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: 'v1.2.3-alpha04'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 本仓库
        uses: actions/checkout@v4
      - name: 更新脚本文件
        run: |
          echo '' | base64 -d > .github/scripts/00_version.sh
          echo '' | base64 -d > .github/scripts/05_music_tab.sh
          echo '' | base64 -d > .github/scripts/07_keystore.sh
          echo '' | base64 -d > .github/scripts/09_appicon.sh
          echo '' | base64 -d > .github/scripts/insert_music_filter.py
          chmod +x .github/scripts/*.sh
      - name: 克隆源码（从自己的 Fork）
        run: git clone --depth 1 https://github.com/moonbbin/AVBox.git avbox
      - name: 设置版本号
        run: bash .github/scripts/00_version.sh "${{ inputs.version }}"
      - name: 应用清风品牌修改
        run: bash .github/scripts/01_branding.sh
      - name: 修改设置页顶部应用名
        run: bash .github/scripts/02_settings_appname.sh
      - name: 设置页头像改为圆形猫咪
        run: bash .github/scripts/03_cat_avatar.sh
      - name: 修改首页左上角图标（改小+圆角）
        run: bash .github/scripts/04_home_icon.sh
      - name: 添加音乐tab和隐藏开关
        run: bash .github/scripts/05_music_tab.sh
      - name: 写入正确的图标文件
        run: bash .github/scripts/06_icons.sh
      - name: 写入固定签名
        run: bash .github/scripts/07_keystore.sh
      - name: 替换应用图标为 Hello（含 round）
        run: bash .github/scripts/09_appicon.sh
      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装 SDK 组件
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: 构建
        run: |
          cd avbox
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: 编译错误摘要
        if: failure()
        run: |
          cd avbox
          ./gradlew assembleDebug 2>&1 | grep "^e: " | head -30 || echo "未找到 e: 错误行"
      - name: 重命名 APK
        if: success()
        run: |
          cd avbox
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$APK" "../qingfeng_${{ inputs.version }}.apk"
      - name: 发布到 Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: 清风 ${{ inputs.version }}
          files: qingfeng_${{ inputs.version }}.apk
