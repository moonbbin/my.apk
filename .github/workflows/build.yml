name: Build APK
"on":
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 v1.0.0)'
        required: true
        default: 'v1.0.8'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 克隆原仓库
        run: git clone --depth 1 https://github.com/XiaochangXu/AVBox.git avbox

      - name: 应用清风品牌修改
        run: |
          cd avbox
          sed -i 's/AVBox/清风/g' app/src/main/res/values/strings.xml
          sed -i 's/applicationId = "com.github.avbox.osc"/applicationId = "com.qingfeng.tvbox"/' app/build.gradle.kts
          sed -i 's/AVBox_/qingfeng_/g' app/build.gradle.kts


      - name: 修改设置页顶部应用名
        run: |
          cd avbox
          F='app/src/main/java/com/github/tvbox/osc/ui/page/SettingsAppInfoCard.kt'
          sed -i 's/text = "AVBox"/text = "清风"/' "$F"
          echo "=== 验证修改 ==="
          grep -n 'text = "清风"' "$F"

      - name: 设置页头像改为圆形猫咪
        run: |
          cd avbox
          F='app/src/main/java/com/github/tvbox/osc/ui/page/SettingsAppInfoCard.kt'
          # 加 import
          sed -i '/import androidx.compose.foundation.background/a import androidx.compose.foundation.Image' "$F"
          sed -i '/import androidx.compose.foundation.shape.RoundedCornerShape/a import androidx.compose.foundation.shape.CircleShape' "$F"
          sed -i '/import androidx.compose.ui.draw.scale/a import androidx.compose.ui.layout.ContentScale' "$F"
          # 齿轮形 -> 圆形
          sed -i 's/.clip(MaterialShapes.Cookie12Sided.toShape())/.clip(CircleShape)/' "$F"
          # Icon -> Image (perl 多行替换)
          perl -0777 -i -pe 's/                Icon\(\n                    painter = painterResource\(R\.drawable\.ic_launcher_foreground\),\n                    contentDescription = null,\n                    tint = contentColor,\n                    modifier = Modifier\n                        \.size\(AppBadgeSize\)\n                        \.scale\(AppIconGlyphScale\),\n                \)/                Image(\n                    painter = painterResource(R.drawable.ic_cat_avatar),\n                    contentDescription = null,\n                    contentScale = ContentScale.Crop,\n                    modifier = Modifier.size(AppBadgeSize),\n                )/s' "$F"
          echo "头像 Icon 已替换为 Image" 
          echo "=== 验证 ==="
          grep -n "CircleShape\|ic_cat_avatar" "$F" | head -5

      - name: 修改首页左上角图标（改小+圆角）
        run: |
          cd avbox
          F='app/src/main/java/com/github/tvbox/osc/ui/page/HomePage.kt'
          # 26.dp -> 20.dp (仅 capsule logo 那一行，通过下一行 drawBehind 定位)
          # 将唯一的 .size(26.dp) 改为 20.dp 并加圆角
          sed -i 's/\.size(26\.dp)/.size(20.dp)\n                            .clip(RoundedCornerShape(6.dp))/' "$F"
          echo "=== 验证修改 ==="
          sed -n '169,175p' "$F"

      - name: 添加音乐tab和隐藏开关（v1.0.8）
        run: |
          cd avbox
          set -e
          MS=app/src/main/java/com/github/tvbox/osc/ui/page/MainScreen.kt
          HC=app/src/main/java/com/github/tvbox/osc/util/HawkConfig.kt
          SP=app/src/main/java/com/github/tvbox/osc/ui/page/SettingsPage.kt
          PP=app/src/main/java/com/github/tvbox/osc/ui/page/PreferenceSettingsPage.kt
          SX=app/src/main/res/values/strings.xml
          echo "=== 添加音乐 tab ==="
          echo "" | base64 -d > /tmp/insert_music_toggle.py
          perl -0pi -e 's/FOLLOWING\(R\.string\.tab_following, R\.drawable\.ic_tab_following\),\n    SETTINGS/FOLLOWING(R.string.tab_following, R.drawable.ic_tab_following),\n    MUSIC(R.string.tab_music, R.drawable.ic_tab_music),\n    SETTINGS/' $MS
          perl -0pi -e 's/AppTab\.FOLLOWING -> FollowingPage\(contentPadding = pageContentPadding\)/AppTab.FOLLOWING -> FollowingPage(contentPadding = pageContentPadding)\n                                AppTab.MUSIC -> { val ctx = LocalContext.current; LaunchedEffect(Unit) { ctx.startActivity(Intent(ctx, MusicPlayerActivity::class.java)) }; Box(modifier = Modifier.fillMaxSize()) }/' $MS
          grep -q "import android.content.Intent" $MS || sed -i '1i import android.content.Intent' $MS
          grep -q "import androidx.compose.ui.platform.LocalContext" $MS || sed -i '/import android.content.Intent/a import androidx.compose.ui.platform.LocalContext' $MS
          grep -q "com.github.tvbox.osc.ui.activity.MusicPlayerActivity" $MS || sed -i '/import androidx.compose.ui.platform.LocalContext/a import com.github.tvbox.osc.ui.activity.MusicPlayerActivity' $MS
          grep -q "import androidx.compose.foundation.layout.Box" $MS || sed -i '/import com.github.tvbox.osc.ui.activity.MusicPlayerActivity/a import androidx.compose.foundation.layout.Box' $MS
          grep -q 'name="tab_music"' $SX || sed -i 's|<string name="tab_home">首页</string>|<string name="tab_home">首页</string>\n    <string name="tab_music">音乐</string>|' $SX
          cp app/src/main/res/drawable/ic_music_page.xml app/src/main/res/drawable/ic_tab_music.xml
          grep -q "NAV_MUSIC_HIDDEN" $HC || perl -0pi -e 's/const val NAV_LIVE_HIDDEN = "nav_live_hidden"/const val NAV_LIVE_HIDDEN = "nav_live_hidden"\n    const val NAV_MUSIC_HIDDEN = "nav_music_hidden"/' $HC
          grep -q "settings_nav_music_hidden" $SX || sed -i 's|</resources>|    <string name="settings_nav_music_hidden">导航栏隐藏音乐</string>\n    <string name="settings_nav_music_hidden_subtitle">开启后导航栏不再显示音乐入口</string>\n</resources>|' $SX
          cp app/src/main/res/drawable/ic_music_page.xml app/src/main/res/drawable/ic_pref_nav_music_hidden.xml
          grep -q "val navMusicHidden" $SP || perl -0pi -e 's/val navLiveHidden: Boolean,/val navLiveHidden: Boolean,\n    val navMusicHidden: Boolean,/' $SP
          grep -q "NAV_MUSIC_HIDDEN, false" $SP || perl -0pi -e 's/navLiveHidden = KV\.get\(HawkConfig\.NAV_LIVE_HIDDEN, false\),/navLiveHidden = KV.get(HawkConfig.NAV_LIVE_HIDDEN, false),\n        navMusicHidden = KV.get(HawkConfig.NAV_MUSIC_HIDDEN, false),/' $SP
          python3 /tmp/insert_music_toggle.py
          echo "=== 音乐 tab 添加完成 ==="
      - name: 写入正确的图标文件
        run: |
          cd avbox
          # 删除可能损坏的 foreground xml，用正确的 webp 替代
          rm -f app/src/main/res/drawable/ic_launcher_foreground.xml
          # 写入猫咪头像
          echo "" | base64 -d > app/src/main/res/drawable/ic_cat_avatar.webp
          ls -lh app/src/main/res/drawable/ic_cat_avatar.webp
          echo "" | base64 -d > app/src/main/res/drawable/ic_launcher_foreground.webp
          echo "Foreground 图标:"
          ls -lh app/src/main/res/drawable/ic_launcher_foreground.webp
          file app/src/main/res/drawable/ic_launcher_foreground.webp

      - name: 写入固定签名（保证更新可覆盖安装）
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
          ls -lh ~/.android/debug.keystore
          echo "固定签名已写入"

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 SDK 组件
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-37" "ndk;27.2.12479018" 2>&1 | tail -5

      - name: 构建
        working-directory: avbox
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "=========================================="
            echo "❌ 编译错误摘要："
            echo "=========================================="
            grep -E "^e: " /tmp/gradle.log | head -20 || echo "(未找到 e: 错误行)"
            echo ""
            echo "=========================================="
            exit $EXIT_CODE
          fi

      - name: 重命名 APK
        run: |
          cd avbox/app/build/outputs/apk/debug
          ls -lh *.apk
          SRC=$(ls *.apk | grep -v "qingfeng_${{ inputs.version }}" | head -n1)
          echo "源文件: $SRC"
          cp "$SRC" "qingfeng_${{ inputs.version }}.apk"
          ls -lh qingfeng_*.apk

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: 清风 ${{ inputs.version }}
          files: avbox/app/build/outputs/apk/debug/qingfeng_${{ inputs.version }}.apk
          generate_release_notes: false
