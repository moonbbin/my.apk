name: Build APK
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 克隆原仓库
        run: git clone --depth 1 https://github.com/XiaochangXu/AVBox.git avbox

      - name: 应用清风品牌修改
        run: |
          cd avbox
          sed -i 's/AVBox/清风/g' app/src/main/res/values/strings.xml
          sed -i 's/applicationId = "com.github.avbox.osc"/applicationId = "com.qingfeng.tvbox"/' app/build.gradle.kts
          sed -i 's/AVBox_/qingfeng_/g' app/build.gradle.kts

      - name: 下载图标并覆盖
        run: |
          BASE="https://raw.githubusercontent.com/moonbbin/my.apk/main/app/src/main/res"
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            for f in ic_launcher.webp ic_launcher_round.webp; do
              curl -sL "$BASE/$d/$f" -o "avbox/app/src/main/res/$d/$f"
              echo "$d/$f: $(ls -lh avbox/app/src/main/res/$d/$f 2>/dev/null | awk '{print $5}' || echo 'FAILED')"
            done
          done
          curl -sL "$BASE/drawable/ic_launcher_foreground.webp" -o "avbox/app/src/main/res/drawable/ic_launcher_foreground.webp"
          rm -f avbox/app/src/main/res/drawable/ic_launcher_foreground.xml
          ls -lh avbox/app/src/main/res/drawable/ic_launcher_foreground.*

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 SDK 组件
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-37" "ndk;27.2.12479018" 2>&1 | tail -5

      - name: 构建
        working-directory: avbox
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 重命名 APK
        run: |
          cd avbox/app/build/outputs/apk/debug
          cp app-debug.apk qingfeng_${{ inputs.version }}.apk
          ls -lh qingfeng_*.apk

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: 清风 ${{ inputs.version }}
          files: avbox/app/build/outputs/apk/debug/qingfeng_${{ inputs.version }}.apk
          generate_release_notes: false
