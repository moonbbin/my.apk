name: Build APK
"on":
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 v1.0.0)'
        required: true
        default: 'v1.0.9'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 本仓库
        uses: actions/checkout@v4

      - name: 克隆原仓库
        run: git clone --depth 1 https://github.com/XiaochangXu/AVBox.git avbox

      - name: 应用清风品牌修改
        run: bash .github/scripts/01_branding.sh

      - name: 修改设置页顶部应用名
        run: bash .github/scripts/02_settings_appname.sh

      - name: 设置页头像改为圆形猫咪
        run: bash .github/scripts/03_cat_avatar.sh

      - name: 修改首页左上角图标（改小+圆角）
        run: bash .github/scripts/04_home_icon.sh

      - name: 添加音乐tab和隐藏开关
        run: bash .github/scripts/05_music_tab.sh

      - name: 写入正确的图标文件
        run: bash .github/scripts/06_icons.sh

      - name: 写入固定签名（保证更新可覆盖安装）
        run: bash .github/scripts/07_keystore.sh

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 SDK 组件
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-37" "ndk;27.2.12479018" 2>&1 | tail -5

      - name: 构建
        working-directory: avbox
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "=========================================="
            echo "❌ 编译错误摘要："
            echo "=========================================="
            grep -E "^e: " /tmp/gradle.log | head -20 || echo "(未找到 e: 错误行)"
            echo ""
            echo "=========================================="
            exit $EXIT_CODE
          fi

      - name: 重命名 APK
        run: |
          cd avbox/app/build/outputs/apk/debug
          ls -lh *.apk
          SRC=$(ls *.apk | grep -v "qingfeng_${{ inputs.version }}" | head -n1)
          echo "源文件: $SRC"
          cp "$SRC" "qingfeng_${{ inputs.version }}.apk"
          ls -lh qingfeng_*.apk

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: 清风 ${{ inputs.version }}
          files: avbox/app/build/outputs/apk/debug/qingfeng_${{ inputs.version }}.apk
          generate_release_notes: false
