name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 克隆原仓库
        run: git clone --depth 1 https://github.com/XiaochangXu/AVBox.git avbox

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 构建原版
        working-directory: avbox
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 检查 APK
        run: find avbox/app/build/outputs -name "*.apk" 2>/dev/null || echo "没有找到 APK"

      - uses: actions/upload-artifact@v4
        with:
          name: avbox-original-apk
          path: avbox/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
