name: Build APK
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 v1.0.0)'
        required: true
        default: 'v1.0.3'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 克隆原仓库
        run: git clone --depth 1 https://github.com/XiaochangXu/AVBox.git avbox

      - name: 应用清风品牌修改
        run: |
          cd avbox
          sed -i 's/AVBox/清风/g' app/src/main/res/values/strings.xml
          sed -i 's/applicationId = "com.github.avbox.osc"/applicationId = "com.qingfeng.tvbox"/' app/build.gradle.kts
          sed -i 's/AVBox_/qingfeng_/g' app/build.gradle.kts


      - name: 修改首页左上角图标（改小+圆角）
        run: |
          cd avbox
          python3 << 'PYEOF2'
          p = 'app/src/main/java/com/github/tvbox/osc/ui/page/HomePage.kt'
          s = open(p, encoding='utf-8').read()
          old = """                    Box(
                        modifier = Modifier
                            .size(26.dp)
                            .drawBehind {"""
          new = """                    Box(
                        modifier = Modifier
                            .size(20.dp)
                            .clip(RoundedCornerShape(6.dp))
                            .drawBehind {"""
          assert old in s, "未找到目标代码块"
          s = s.replace(old, new, 1)
          open(p, 'w', encoding='utf-8').write(s)
          print("首页图标已改小并加圆角")
          PYEOF2

      - name: 写入正确的图标文件
        run: |
          cd avbox
          # 删除可能损坏的 foreground xml，用正确的 webp 替代
          rm -f app/src/main/res/drawable/ic_launcher_foreground.xml
          echo "" | base64 -d > app/src/main/res/drawable/ic_launcher_foreground.webp
          echo "Foreground 图标:"
          ls -lh app/src/main/res/drawable/ic_launcher_foreground.webp
          file app/src/main/res/drawable/ic_launcher_foreground.webp

      - name: 缓存 debug 签名（保证更新可覆盖安装）
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: qingfeng-debug-keystore-v1

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 安装 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 SDK 组件
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-37" "ndk;27.2.12479018" 2>&1 | tail -5

      - name: 构建
        working-directory: avbox
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 重命名 APK
        run: |
          cd avbox/app/build/outputs/apk/debug
          ls -lh *.apk
          SRC=$(ls *.apk | grep -v "qingfeng_${{ inputs.version }}" | head -n1)
          echo "源文件: $SRC"
          cp "$SRC" "qingfeng_${{ inputs.version }}.apk"
          ls -lh qingfeng_*.apk

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: 清风 ${{ inputs.version }}
          files: avbox/app/build/outputs/apk/debug/qingfeng_${{ inputs.version }}.apk
          generate_release_notes: false
