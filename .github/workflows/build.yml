name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 克隆原仓库
        run: git clone --depth 1 https://github.com/XiaochangXu/AVBox.git avbox

      - name: 应用清风品牌修改
        run: |
          cd avbox
          sed -i 's/AVBox/清风/g' app/src/main/res/values/strings.xml
          sed -i 's/applicationId = "com.github.avbox.osc"/applicationId = "com.qingfeng.tvbox"/' app/build.gradle.kts
          sed -i 's/AVBox_/qingfeng_/g' app/build.gradle.kts
          echo "=== 修改后检查 ==="
          grep -n "applicationId" app/build.gradle.kts | head -3
          grep -n "清风" app/src/main/res/values/strings.xml | head -3

      - name: 复制图标
        uses: actions/checkout@v4
        with:
          path: myapk
          sparse-checkout: |
            app/src/main/res/mipmap-mdpi
            app/src/main/res/mipmap-hdpi
            app/src/main/res/mipmap-xhdpi
            app/src/main/res/mipmap-xxhdpi
            app/src/main/res/mipmap-xxxhdpi
            app/src/main/res/drawable/ic_launcher_foreground.webp

      - name: 覆盖图标到 AVBox
        run: |
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp -f myapk/app/src/main/res/$d/* avbox/app/src/main/res/$d/ 2>/dev/null || true
          done
          cp -f myapk/app/src/main/res/drawable/ic_launcher_foreground.webp avbox/app/src/main/res/drawable/ 2>/dev/null || true
          rm -f avbox/app/src/main/res/drawable/ic_launcher_foreground.xml
          ls avbox/app/src/main/res/mipmap-xxxhdpi/

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 构建
        run: |
          cd avbox
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -50

      - uses: actions/upload-artifact@v4
        with:
          name: qingfeng-apk
          path: avbox/app/build/outputs/apk/debug/*.apk
